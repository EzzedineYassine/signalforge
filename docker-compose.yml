services:
  postgres:
    image: postgres:16-alpine
    container_name: signalforge-postgres
    environment:
      POSTGRES_USER: signalforge
      POSTGRES_PASSWORD: signalforge_dev
      POSTGRES_DB: signalforge
    ports:
      - "5432:5432"
    volumes:
      - signalforge_pgdata:/var/lib/postgresql/data
      - ./database/init/01-create-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalforge -d signalforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: signalforge-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - signalforge_qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  signalforge_pgdata:
  signalforge_qdrant_data:
