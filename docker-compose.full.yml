services:
  postgres:
    image: postgres:16-alpine
    container_name: signalforge-full-postgres
    environment:
      POSTGRES_USER: signalforge
      POSTGRES_PASSWORD: signalforge_dev
      POSTGRES_DB: signalforge
    ports:
      - "5432:5432"
    volumes:
      - signalforge_full_pgdata:/var/lib/postgresql/data
      - ./database/init/01-create-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalforge -d signalforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: signalforge-full-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - signalforge_full_qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: signalforge-full-api
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://signalforge:signalforge_dev@postgres:5432/signalforge
      TEST_DATABASE_URL: postgresql+psycopg://signalforge:signalforge_dev@postgres:5432/signalforge_test
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: signalforge_knowledge
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:7b
      OLLAMA_TIMEOUT_SECONDS: "60.0"
      OLLAMA_NUM_CTX: "8192"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: signalforge-full-web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  signalforge_full_pgdata:
  signalforge_full_qdrant_data:
